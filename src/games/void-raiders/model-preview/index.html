<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Void Raiders — Ship Configurator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a14;
      color: #c8c8e0;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    /* --- Left sidebar: model list --- */
    #sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      background: #0e0e1a;
      border-right: 1px solid #2a2a4a;
      overflow-y: auto;
      z-index: 10;
      display: flex;
      flex-direction: column;
    }
    #sidebar h1 {
      font-size: 13px;
      padding: 14px;
      color: #7b7bf7;
      border-bottom: 1px solid #2a2a4a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .model-card {
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a30;
      cursor: pointer;
      transition: background 0.15s;
    }
    .model-card:hover { background: #16163a; }
    .model-card.active { background: #1a1a50; border-left: 3px solid #7b7bf7; }
    .model-card .name { font-size: 12px; font-weight: bold; color: #e0e0ff; margin-bottom: 3px; }
    .model-card .meta { font-size: 10px; color: #6868a0; }
    .model-card .meta span { margin-right: 10px; }
    .model-card .author { font-size: 10px; color: #5858a0; margin-top: 2px; }

    /* --- Viewport --- */
    #viewport { position: fixed; left: 260px; top: 0; right: 0; bottom: 0; }
    canvas { display: block; }

    /* --- Bottom info bar --- */
    #info-bar {
      position: fixed;
      left: 260px; bottom: 0; right: 0;
      height: 36px;
      background: rgba(10, 10, 20, 0.9);
      border-top: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      font-size: 11px;
      color: #6868a0;
      gap: 20px;
      z-index: 10;
    }
    #info-bar .stat { color: #a0a0d0; }

    /* --- Loading overlay --- */
    #loading {
      position: fixed;
      left: 260px; top: 0; right: 0; bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #5858a0;
      z-index: 5;
      pointer-events: none;
    }
    #loading.hidden { display: none; }

    /* --- Right panel --- */
    #right-panel {
      position: fixed;
      right: 0; top: 0; bottom: 36px;
      width: 300px;
      background: rgba(14, 14, 26, 0.95);
      border-left: 1px solid #2a2a4a;
      z-index: 10;
      display: none;
      flex-direction: column;
    }
    #right-panel.visible { display: flex; }

    /* Tabs */
    .panel-tabs {
      display: flex;
      border-bottom: 1px solid #2a2a4a;
    }
    .panel-tab {
      flex: 1;
      padding: 10px 8px;
      font-size: 11px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: none;
      border: none;
      color: #5858a0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .panel-tab:hover { color: #a0a0d0; }
    .panel-tab.active { color: #7b7bf7; border-bottom-color: #7b7bf7; }

    .tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* --- Mesh tab --- */
    .mesh-item {
      padding: 6px 12px;
      border-bottom: 1px solid #14142a;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.1s;
    }
    .mesh-item:hover { background: #1a1a3a; }
    .mesh-item.highlighted { background: #2a2a50; }
    .mesh-item .mesh-name { flex: 1; color: #b0b0d0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mesh-item .mesh-faces { color: #5858a0; font-size: 10px; }
    .mesh-item.dimmed .mesh-name { color: #444460; text-decoration: line-through; }
    .mesh-item.turret-tagged { background: #1a2a1a; border-left: 2px solid #7bf77b; }
    .mesh-item.turret-tagged .mesh-name { color: #7bf77b; }
    .mesh-item.turret-base-tagged { background: #1a2a2a; border-left: 2px solid #7bf7f7; }
    .mesh-item.turret-base-tagged .mesh-name { color: #7bf7f7; }
    .mesh-item.island { padding-left: 24px; font-size: 10px; }

    .small-btn {
      padding: 2px 5px;
      font-size: 9px;
      font-family: inherit;
      background: #1a1a30;
      color: #6868a0;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .small-btn:hover { border-color: #7b7bf7; color: #a0a0d0; }
    .small-btn.active { background: #2a2a60; border-color: #7b7bf7; color: #7bf77b; }
    .small-btn.danger { background: #301a1a; border-color: #7b4040; color: #f77b7b; }

    /* --- Hardpoint tab --- */
    #hp-toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    #hp-toolbar .small-btn { padding: 4px 8px; font-size: 10px; }
    #hp-place-mode.active { background: #1a3a1a; border-color: #40a040; color: #7bf77b; }
    .hp-place-type.active { background: #2a3a50; border-color: #5080a0; color: #9bccff; }
    #hp-rig-mode.active { background: #1a3a2a; border-color: #40a060; color: #7bf77b; }
    #hp-auto-mode.active { background: #1a3a3a; border-color: #40a0a0; color: #7bf7f7; }
    #hp-bay-mode.active { background: #2a3a1a; border-color: #60a040; color: #aaff7b; }
    #rig-status {
      padding: 6px 12px;
      border-bottom: 1px solid #2a2a4a;
      font-size: 10px;
      color: #7bf77b;
      background: #0e1a14;
      display: none;
    }
    #rig-status.visible { display: block; }

    #hp-list { flex: 1; overflow-y: auto; }

    .hp-item {
      padding: 8px 12px;
      border-bottom: 1px solid #14142a;
      cursor: pointer;
      transition: background 0.1s;
    }
    .hp-item:hover { background: #1a1a3a; }
    .hp-item.selected { background: #1a1a50; border-left: 3px solid #7b7bf7; }
    .hp-item .hp-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .hp-item .hp-name { flex: 1; font-size: 12px; color: #e0e0ff; font-weight: bold; }
    .hp-item .hp-type { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
    .hp-item .hp-row-delete {
      background: transparent; border: 1px solid #3a1a1a; color: #f77b7b;
      width: 18px; height: 18px; line-height: 14px; padding: 0; font-size: 12px;
      border-radius: 3px; cursor: pointer;
    }
    .hp-item .hp-row-delete:hover { background: #3a1a1a; border-color: #a04040; }
    /* Test arena panel */
    #arena-panel {
      margin-top: 10px;
      padding: 8px;
      background: #11131c;
      border: 1px solid #1f2233;
      border-radius: 4px;
    }
    .arena-title {
      font-size: 11px;
      font-weight: bold;
      color: #ffaa55;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
    }
    .arena-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-bottom: 4px;
    }
    #arena-hud {
      margin-top: 6px;
      padding: 6px;
      background: #0a0c14;
      border: 1px solid #1a1d2a;
      border-radius: 3px;
      font-size: 10px;
      color: #b8c4dd;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      max-height: 240px;
      overflow-y: auto;
    }
    #arena-hud .arena-hud-section {
      color: #88ccff;
      font-weight: bold;
      margin: 4px 0 2px 0;
    }
    #arena-hud .arena-hud-row {
      display: flex;
      justify-content: space-between;
      padding: 1px 0;
      color: #b8c4dd;
    }
    #arena-hud .arena-hud-row.dead {
      color: #5a5f70;
      text-decoration: line-through;
    }
    #arena-hud .arena-hull-bar {
      display: inline-block;
      width: 30px;
      height: 5px;
      background: #2a2020;
      margin: 0 3px;
      vertical-align: middle;
    }
    #arena-hud .arena-hull-bar span {
      display: block;
      height: 100%;
      background: #66ff88;
    }
    #arena-hud .arena-shield-bar span { background: #44aaff; }
    .hp-type-turret { background: #2a2a50; color: #7b7bf7; }
    .hp-type-ball_turret { background: #2a2a60; color: #9b9bff; }
    .hp-type-missile_launcher { background: #502a2a; color: #f77b7b; }
    .hp-type-drone_bay { background: #2a502a; color: #7bf77b; }
    .hp-type-point_defense { background: #50502a; color: #f7f77b; }

    /* --- Hardpoint editor --- */
    #hp-editor {
      border-top: 1px solid #2a2a4a;
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
    }
    #hp-editor.visible { display: flex; }
    #hp-editor label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8888b0;
    }
    #hp-editor input[type="text"], #hp-editor select {
      background: #12122a;
      color: #c8c8e0;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 11px;
      width: 150px;
    }
    #hp-editor input[type="range"] {
      width: 100px;
      accent-color: #7b7bf7;
    }
    .arc-row { display: flex; align-items: center; gap: 6px; }
    .arc-row span { width: 32px; text-align: right; color: #a0a0d0; font-size: 10px; }
    .arc-row input { flex: 1; }
    #hp-editor .editor-section {
      border-top: 1px solid #1a1a30;
      padding-top: 6px;
      margin-top: 2px;
    }
    #hp-editor .editor-section-title {
      font-size: 10px;
      color: #5858a0;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    /* --- Save/load bar --- */
    #hp-actions {
      padding: 8px 12px;
      border-top: 1px solid #2a2a4a;
      display: flex;
      gap: 6px;
    }
    #hp-actions .small-btn { padding: 4px 8px; font-size: 10px; flex: 1; text-align: center; }

    /* --- Controls hint --- */
    #controls-hint {
      position: fixed;
      right: 310px; top: 12px;
      font-size: 10px;
      color: #3a3a55;
      text-align: right;
      line-height: 1.5;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <h1>Ship Configurator</h1>
    <div id="model-list"></div>
  </div>

  <div id="viewport"></div>
  <div id="loading">Select a model to preview</div>

  <div id="info-bar">
    <span>Faces: <span id="stat-faces" class="stat">--</span></span>
    <span>Verts: <span id="stat-verts" class="stat">--</span></span>
    <span>Meshes: <span id="stat-meshes" class="stat">--</span></span>
    <span>Author: <span id="stat-author" class="stat">--</span></span>
  </div>

  <div id="right-panel">
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="meshes">Meshes</button>
      <button class="panel-tab" data-tab="hardpoints">Hardpoints</button>
    </div>

    <!-- Meshes tab -->
    <div class="tab-content active" id="tab-meshes">
      <div id="split-controls" style="padding:8px 12px;border-bottom:1px solid #2a2a4a;display:none;font-size:11px;color:#6868a0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <label style="flex:1">Min faces: <span id="split-threshold-val">20</span></label>
          <input type="range" id="split-threshold" min="5" max="100" value="20" style="width:100px;accent-color:#7b7bf7" />
          <button id="split-undo" class="small-btn danger" style="display:none">Undo</button>
        </div>
      </div>
      <div id="mesh-list"></div>
    </div>

    <!-- Hardpoints tab -->
    <div class="tab-content" id="tab-hardpoints">
      <div id="hp-toolbar">
        <button id="hp-detect" class="small-btn" title="Auto-detect and rig all ball turrets on this ship in one click">Detect</button>
        <button id="hp-auto-mode" class="small-btn" title="Click any turret to rig it (one click = one turret)">Auto</button>
        <button id="hp-rig-mode" class="small-btn" title="Click barrel mesh, then base mesh (single turret)">Rig</button>
        <button id="hp-place-mode" class="small-btn hp-place-type" data-place-type="turret" title="Click ship to place a generic turret hardpoint">Place</button>
        <button id="hp-place-ball" class="small-btn hp-place-type" data-place-type="ball_turret" title="Click ship to place a ball turret">+Ball</button>
        <button id="hp-place-heavy" class="small-btn hp-place-type" data-place-type="heavy_cannon" title="Click ship to place a heavy cannon">+Heavy</button>
        <button id="hp-place-missile" class="small-btn hp-place-type" data-place-type="missile_launcher" title="Click ship to place a missile launcher">+Missile</button>
        <button id="hp-bay-mode" class="small-btn" title="Click ship to place a drone bay (drones spawn from here)">Bay</button>
        <button id="hp-show-arcs" class="small-btn active" title="Show/hide firing arcs">Arcs</button>
        <button id="hp-simulate" class="small-btn" title="Simulate turrets tracking a target">Sim</button>
        <span style="flex:1"></span>
        <span id="hp-count" style="font-size:10px;color:#5858a0">0</span>
      </div>
      <div id="rig-status">Click the <b>barrel</b> mesh in the viewport. ESC to cancel.</div>
      <div id="hp-list"></div>
      <div id="hp-editor">
        <label>Name <input type="text" id="hp-name" /></label>
        <label>Type
          <select id="hp-type">
            <option value="turret">Turret</option>
            <option value="ball_turret">Ball Turret</option>
            <option value="heavy_cannon">Heavy Cannon</option>
            <option value="missile_launcher">Missile Launcher</option>
            <option value="drone_bay">Drone Bay</option>
            <option value="point_defense">Point Defense</option>
          </select>
        </label>
        <label>Attack
          <select id="hp-attack-id">
            <option value="">(auto — from type)</option>
            <option value="point-defense-pulse">Point-Defense Pulse</option>
            <option value="arc-emitter">Arc Emitter</option>
            <option value="shield-breaker">Shield Breaker</option>
            <option value="flak-burst">Flak Burst</option>
            <option value="guided-missile">Guided Missile</option>
            <option value="heavy-railgun">Heavy Railgun</option>
          </select>
        </label>
        <div class="editor-section">
          <div class="editor-section-title">Yaw Arc</div>
          <div class="arc-row">
            <span id="hp-yaw-min-val">-180</span>
            <input type="range" id="hp-yaw-min" min="-180" max="0" value="-180" />
            <input type="range" id="hp-yaw-max" min="0" max="180" value="180" />
            <span id="hp-yaw-max-val">180</span>
          </div>
        </div>
        <div class="editor-section">
          <div class="editor-section-title">Pitch Arc</div>
          <div class="arc-row">
            <span id="hp-pitch-min-val">-10</span>
            <input type="range" id="hp-pitch-min" min="-90" max="0" value="-10" />
            <input type="range" id="hp-pitch-max" min="0" max="90" value="60" />
            <span id="hp-pitch-max-val">60</span>
          </div>
        </div>
        <div class="editor-section">
          <div class="editor-section-title">Size + Position Overrides</div>
          <label>Scale <span id="hp-scale-val">1.00</span>
            <input type="range" id="hp-scale" min="0.2" max="4" step="0.05" value="1" />
          </label>
          <label>Offset X <span id="hp-offsetX-val">0.00</span>
            <input type="range" id="hp-offsetX" min="-1" max="1" step="0.01" value="0" />
          </label>
          <label>Offset Y (outward) <span id="hp-offsetY-val">0.00</span>
            <input type="range" id="hp-offsetY" min="-1" max="1" step="0.01" value="0" />
          </label>
          <label>Offset Z (forward) <span id="hp-offsetZ-val">0.00</span>
            <input type="range" id="hp-offsetZ" min="-1" max="1" step="0.01" value="0" />
          </label>
          <label>Yaw <span id="hp-yawOffset-val">0°</span>
            <input type="range" id="hp-yawOffset" min="-180" max="180" step="1" value="0" />
          </label>
          <label>Pitch <span id="hp-pitchOffset-val">0°</span>
            <input type="range" id="hp-pitchOffset" min="-90" max="90" step="1" value="0" />
          </label>
          <button id="hp-reset-overrides" class="small-btn" style="align-self:flex-end;margin-top:2px">Reset overrides</button>
        </div>
        <button id="hp-delete" class="small-btn danger" style="align-self:flex-end;margin-top:4px">Delete Hardpoint</button>
      </div>
      <div id="hp-actions">
        <button id="hp-save" class="small-btn" title="Download the config as a JSON file">Save</button>
        <button id="hp-load" class="small-btn">Load</button>
        <button id="hp-export" class="small-btn">Copy</button>
        <button id="hp-commit" class="small-btn" title="Write the config to public/ships/<modelId>.json so the game loads it by default for all browsers">💾 Commit</button>
        <button id="hp-clear-all" class="small-btn danger" title="Delete all hardpoints and reload the model">Clear</button>
      </div>
      <div id="hp-commit-status" style="font-size:10px;color:#88ff99;margin-top:2px"></div>
      <div id="arena-panel">
        <div class="arena-title">Test Arena</div>
        <div class="arena-row">
          <button id="arena-run" class="small-btn">▶ Run</button>
          <button id="arena-stop" class="small-btn" style="display:none">■ Stop</button>
          <button id="arena-reset" class="small-btn" title="Clear enemies + zero stats">Reset</button>
          <label style="font-size:10px;color:#8a92a6;">
            <input type="radio" name="arena-motion" value="static" checked /> Static
          </label>
          <label style="font-size:10px;color:#8a92a6;">
            <input type="radio" name="arena-motion" value="orbit" /> Orbit
          </label>
        </div>
        <div class="arena-row">
          <label style="font-size:10px;color:#8a92a6;flex:1">
            Fire: <select id="arena-weapon-filter" style="font-size:10px;margin-left:4px">
              <option value="all">All weapons</option>
              <option value="point-defense-pulse">Point-Defense Pulse</option>
              <option value="arc-emitter">Arc Emitter</option>
              <option value="shield-breaker">Shield Breaker</option>
              <option value="flak-burst">Flak Burst</option>
              <option value="guided-missile">Guided Missile</option>
              <option value="heavy-railgun">Heavy Railgun</option>
            </select>
          </label>
        </div>
        <div class="arena-row">
          <button id="arena-spawn-scout" class="small-btn" title="Scout fighter — hull 40, fast">+Scout</button>
          <button id="arena-spawn-patrol" class="small-btn" title="Patrol cruiser — hull 120, slow">+Cruiser</button>
          <button id="arena-spawn-shielded" class="small-btn" title="Shielded cruiser — hull 150 + shields 80">+Shielded</button>
          <button id="arena-spawn-bomber" class="small-btn" title="Bomber — hull 80, tough">+Bomber</button>
          <button id="arena-spawn-interceptor" class="small-btn" title="Interceptor — hull 25, very fast">+Interceptor</button>
          <button id="arena-spawn-cluster" class="small-btn" title="6 scouts in a 15m cluster — tests flak + arc emitter">+Cluster×6</button>
          <button id="arena-clear-enemies" class="small-btn danger">Clear</button>
        </div>
        <div id="arena-hud"></div>
      </div>
    </div>
  </div>

  <div id="controls-hint">
    Left-drag: orbit<br>
    Scroll: zoom<br>
    Right-drag: pan<br>
    Dbl-click: reset<br>
  </div>

  <input type="file" id="hp-file-input" accept=".json" style="display:none" />
  <script type="module" src="./preview.js"></script>
</body>
</html>
